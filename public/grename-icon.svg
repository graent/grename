<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Grename">
  <!--
    Grename brand mark / single source of truth.
    Used by: public favicon (index.html), TitleBar, SplashScreen,
    and `npx tauri icon` -> src-tauri/icons/{ico,icns,png...} (desktop + taskbar).
    Palette follows the app shell: #0F5F5C primary, #6FD0C4 accent.
    Transparent outside the rounded tile, so it scales cleanly at 16px.
  -->
  <defs>
    <linearGradient id="grBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B9084"/>
      <stop offset="0.52" stop-color="#0F5F5C"/>
      <stop offset="1" stop-color="#0A4441"/>
    </linearGradient>
    <linearGradient id="grSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="grAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FE8D7"/>
      <stop offset="1" stop-color="#3FA99B"/>
    </linearGradient>
    <clipPath id="grTile">
      <rect x="16" y="16" width="480" height="480" rx="112"/>
    </clipPath>
    <filter id="grShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#052C29" flood-opacity="0.34"/>
    </filter>
  </defs>

  <!-- rounded tile -->
  <g clip-path="url(#grTile)">
    <rect x="16" y="16" width="480" height="480" fill="url(#grBg)"/>
    <rect x="16" y="16" width="480" height="480" fill="url(#grSheen)"/>
  </g>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4"/>

  <!-- document with folded corner -->
  <g filter="url(#grShadow)">
    <path d="M170 126 H290 L332 168 V356 A22 22 0 0 1 310 378 H170 A22 22 0 0 1 148 356 V148 A22 22 0 0 1 170 126 Z" fill="#F7FBFA"/>
  </g>
  <path d="M290 126 V168 H332 Z" fill="#C9E3DF"/>
  <path d="M290 126 V168 H332" fill="none" stroke="#A9CFC9" stroke-width="3" stroke-linejoin="round"/>

  <!-- text lines = file names being processed -->
  <rect x="178" y="204" width="128" height="14" rx="7" fill="#BFD8D6"/>
  <rect x="178" y="242" width="104" height="14" rx="7" fill="#D3E7E3"/>
  <rect x="178" y="280" width="118" height="14" rx="7" fill="#D3E7E3"/>

  <!-- rename / transform badge -->
  <circle cx="352" cy="352" r="70" fill="url(#grAccent)" stroke="#F7FBFA" stroke-width="8"/>
  <path d="M324 352 H382 M362 332 L382 352 L362 372" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
